# Pipeline-wide script, visual, and render defaults. Changes apply to new runs;
# each run snapshots these values so a restart cannot silently change its output.
#
# OpenAI-compatible hosted alternatives use base_url https://api.x.ai/v1 with
# api_key_env XAI_API_KEY, or base_url https://api.openai.com/v1 with
# api_key_env OPENAI_API_KEY. Set model to one available from that provider.
script_provider:
  base_url: http://100.103.129.82:11434/v1
  model: qwen3.6:35b-a3b
  api_key_env: null
  # Overall ceiling; API_REQUEST_TIMEOUT remains the per-chunk inactivity limit.
  timeout_seconds: 900
# Independent visual providers. CLI --visuals is shorthand; the individual
# --frames-provider/--video-provider flags override it. Defaults stay local.
frames_provider: local
video_provider: local
# Persisted per-run ceiling for billable Grok Imagine POST attempts, including
# frame regeneration and bounded 429 retries.
imagine_call_cap: 40
# Narration drives timing: the script fills the target, then each clip uses its
# measured shot narration plus padding, bounded by the per-clip cap.
target_duration_seconds: 45
clip_padding: 0.4
max_clip_seconds: 6.0
style_block: "isometric voxel diorama, chunky cubic blocks, cutaway cross-section view, tilt-shift macro photography, soft studio lighting, vibrant color palette against dark clean background, highly detailed 3D render"
frame_model: flux2_klein
video_mode: auto
video_resolution: 720x1280
steps_draft: 4
steps_final: 8
negative_prompt: "text, typography, captions, logos, watermarks, user interface, photorealistic humans, realistic faces"
fps_out: 30
caption_style:
  captions_enabled: true
  font_size: 72
  base_color: "#FFFFFF"
  highlight_color: "#FFD54A"
  # Percent of frame height above the bottom edge; 20 keeps captions UI-safe.
  position: 20
narration_style: "Conversational, curious, direct, and warm."
# Use "default" for the worker's stock voice, or a named VOICE_PRESETS entry.
voice: narrator
