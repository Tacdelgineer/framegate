# Shared model roots. These are references to files already on the host; the
# ComfyUI service mounts them read-only and never copies or downloads weights.
content_factory_shared:
  base_path: /models/comfyui
  checkpoints: checkpoints
  diffusion_models: diffusion_models
  unet: unet
  text_encoders: text_encoders
  clip: clip
  clip_vision: clip_vision
  vae: vae
  loras: loras

content_factory_upscalers:
  base_path: /external-models
  upscale_models: upscale_models
